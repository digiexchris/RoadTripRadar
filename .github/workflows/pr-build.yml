name: PR Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-changelogs:
    # Read-only consistency check. The fastlane next.txt is generated on main
    # by .github/workflows/sync-fastlane-next-changelog.yml — never on PR
    # branches — so this job only verifies the PR doesn't ship a stale next.txt.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Validate next.txt vs changelog.json
        run: |
          python3 <<'PY'
          import json, pathlib, sys

          data = json.loads(pathlib.Path('app/src/main/assets/changelog.json').read_text())
          releases = data.get('releases') or []
          top_name = releases[0].get('versionName') if releases else None
          stale = sorted(
              str(p) for p in pathlib.Path('fastlane/metadata/android').glob('*/changelogs/next.txt')
          )

          # The only invalid state we can detect at PR time is: the top entry is
          # already a real released version (so no "next" is pending) but a
          # next.txt file exists. That means a stale PR is resurrecting a
          # next.txt the release pipeline already renamed away.
          if top_name != 'next' and stale:
              print(
                  f"::error::Top changelog entry is '{top_name}' (not 'next') but next.txt "
                  f"still exists in {len(stale)} locale(s):"
              )
              for s in stale:
                  print(f"  {s}")
              print(
                  "::error::This usually means a PR branched from pre-release main is "
                  "resurrecting a deleted next.txt. Rebase on main and delete the file(s)."
              )
              sys.exit(1)

          if top_name == 'next':
              print(f"OK: pending 'next' entry; {len(stale)} next.txt file(s) on disk "
                    "(regenerated on main after merge)")
          else:
              print("OK: no pending 'next' entry and no stale next.txt files")
          PY

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check translation completeness
        run: python scripts/check_translations.py

  build:
    runs-on: ubuntu-latest
    environment: pr-build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build and sign
        uses: ./.github/actions/build-sign
        with:
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts for PR
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/RoadTripRadar-PR-${PR_NUM}.apk"
          mv app/build/outputs/bundle/release/*.aab "app/build/outputs/bundle/release/RoadTripRadar-PR-${PR_NUM}.aab"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Comment on PR with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '<!-- pr-build-comment -->',
              '### PR Build',
              `[Download artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `Built from commit \`${context.sha.substring(0, 7)}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('<!-- pr-build-comment -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
