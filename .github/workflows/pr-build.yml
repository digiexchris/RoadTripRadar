name: PR Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate fastlane changelog
        run: python scripts/generate_changelogs.py
      - name: Validate next.txt vs changelog.json
        run: |
          python3 <<'PY'
          import json, pathlib, sys

          data = json.loads(pathlib.Path('app/src/main/assets/changelog.json').read_text())
          releases = data.get('releases') or []
          top_name = releases[0].get('versionName') if releases else None
          stale = sorted(
              str(p) for p in pathlib.Path('fastlane/metadata/android').glob('*/changelogs/next.txt')
          )

          if top_name == 'next':
              if not stale:
                  print("::error::changelog.json has a pending 'next' entry but no next.txt files exist")
                  sys.exit(1)
              print(f"OK: pending 'next' entry with {len(stale)} next.txt file(s)")
          else:
              if stale:
                  print(
                      f"::error::Top changelog entry is '{top_name}' (not 'next') but next.txt "
                      f"still exists in {len(stale)} locale(s):"
                  )
                  for s in stale:
                      print(f"  {s}")
                  print(
                      "::error::This usually means a PR branched from pre-release main is "
                      "resurrecting a deleted next.txt. Rebase on main and re-run "
                      "`scripts/generate_changelogs.py`."
                  )
                  sys.exit(1)
              print(f"OK: no pending 'next' entry and no stale next.txt files")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fastlane/
          git diff --cached --quiet && echo "No changelog changes to commit" || {
            git commit -m "chore: generate fastlane changelog"
            git push
          }

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check translation completeness
        run: python scripts/check_translations.py

  build:
    runs-on: ubuntu-latest
    environment: pr-build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build and sign
        uses: ./.github/actions/build-sign
        with:
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts for PR
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/RoadTripRadar-PR-${PR_NUM}.apk"
          mv app/build/outputs/bundle/release/*.aab "app/build/outputs/bundle/release/RoadTripRadar-PR-${PR_NUM}.aab"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Comment on PR with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '<!-- pr-build-comment -->',
              '### PR Build',
              `[Download artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `Built from commit \`${context.sha.substring(0, 7)}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('<!-- pr-build-comment -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
