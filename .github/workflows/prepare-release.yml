name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.2.0)"
        required: true
      prerelease:
        description: "Mark as pre-release (e.g. for RC builds)"
        type: boolean
        default: false
      rebuild_only:
        description: "Rebuild and re-sign only (skip version bump, reuse existing tag/release)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ steps.app-token.outputs.token }}  # use app token for checkout so push works

      - name: Validate changelog has pending items
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        run: |
          python3 -c "
          import json, sys
          data = json.loads(open('app/src/main/assets/changelog.json').read())
          r = data['releases'][0]
          if r.get('versionName') != 'next':
              print('::error::Latest changelog entry versionName is not \"next\" — already released?', file=sys.stderr)
              sys.exit(1)
          items = r.get('items', [])
          if not items:
              print('::error::Latest changelog entry has no items', file=sys.stderr)
              sys.exit(1)
          print(f'OK: {len(items)} pending changelog item(s)')
          "

      - name: Compute versionCode and release versionName
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        run: |
          CURRENT=$(git tag --list 'v*' | wc -l)
          CODE=$((CURRENT + 1))
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          echo "Will write versionCode=$CODE and versionName=${{ github.event.inputs.version }} to app/build.gradle.kts"

      - name: Read versionCode for rebuild
        if: ${{ github.event.inputs.rebuild_only == 'true' }}
        run: |
          VERSION_NAME="${{ github.event.inputs.version }}"
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Bump versionCode and versionName in app/build.gradle.kts
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          grep -E '^\s+version(Code|Name)\s*=' app/build.gradle.kts

      - name: Write GitHub release notes
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        run: |
          python3 -c "
          import json
          data = json.loads(open('app/src/main/assets/changelog.json').read())
          items = data['releases'][0]['items']
          with open('release_notes.md', 'w') as f:
              f.write('\n'.join(f'- {item}' for item in items) + '\n')
          "

      - name: Stamp changelog and rename fastlane changelogs
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        run: |
          python3 -c "
          import json, glob, os

          # Stamp changelog.json with real version
          cl_path = 'app/src/main/assets/changelog.json'
          data = json.loads(open(cl_path).read())
          data['releases'][0]['versionName'] = '${{ env.VERSION_NAME }}'
          data['releases'][0]['versionCode'] = ${{ env.VERSION_CODE }}
          with open(cl_path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')

          # Rename next.txt -> {versionCode}.txt in all locale changelogs dirs
          code = str(${{ env.VERSION_CODE }})
          for next_file in glob.glob('fastlane/metadata/android/*/changelogs/next.txt'):
              target = os.path.join(os.path.dirname(next_file), code + '.txt')
              os.rename(next_file, target)
              print(f'Renamed {next_file} -> {target}')
          "

      - name: Commit and tag
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/assets/changelog.json fastlane/
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "Release v${VERSION_NAME}"
          }
          git tag "v${VERSION_NAME}"
          git push origin ${{ github.ref_name }} --tags

      - name: Upload fastlane changelog
        if: ${{ github.event.inputs.rebuild_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-changelog
          path: fastlane/metadata/android/en-US/changelogs/${{ env.VERSION_CODE }}.txt
          retention-days: 90

      - name: Checkout tag for rebuild
        if: ${{ github.event.inputs.rebuild_only == 'true' }}
        run: git checkout "v${VERSION_NAME}"

      - name: Build and sign
        uses: ./.github/actions/build-sign
        with:
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK and AAB
        run: |
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/RoadTripRadar-v${VERSION_NAME}.apk"
          mv app/build/outputs/bundle/release/*.aab "app/build/outputs/bundle/release/RoadTripRadar-v${VERSION_NAME}.aab"

      - name: Create or update GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          APK_PATH="app/build/outputs/apk/release/RoadTripRadar-v${VERSION_NAME}.apk"
          AAB_PATH="app/build/outputs/bundle/release/RoadTripRadar-v${VERSION_NAME}.aab"

          if [ "${{ github.event.inputs.rebuild_only }}" = "true" ]; then
            # Delete existing assets and upload replacements
            gh release delete-asset "$TAG" "RoadTripRadar-v${VERSION_NAME}.apk" --yes 2>/dev/null || true
            gh release delete-asset "$TAG" "RoadTripRadar-v${VERSION_NAME}.aab" --yes 2>/dev/null || true
            gh release upload "$TAG" "$APK_PATH" "$AAB_PATH"
          else
            PRERELEASE_FLAG=""
            if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG \
              "$APK_PATH" "$AAB_PATH"
          fi
