name: Sync Fastlane next.txt

# Keeps fastlane/metadata/android/en-US/changelogs/next.txt in sync with the `items`
# of the `"next"` entry in app/src/main/assets/changelog.json whenever that file
# changes on main. This lets Crowdin pick up the new English changelog and
# translate it into other locales before a release is cut.
#
# The workflow only pushes next.txt when its contents would actually change, so
# it will not loop on its own commits (and its own commits don't touch
# changelog.json so the paths filter would skip them anyway).

on:
  push:
    branches:
      - main
    paths:
      - app/src/main/assets/changelog.json
  workflow_dispatch:

concurrency:
  group: sync-fastlane-next-changelog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse non-main runs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow may only run on main (got ${{ github.ref }})"
          exit 1

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate English next.txt from pending changelog
        run: python3 scripts/generate_changelogs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage adds, modifies, and deletes within the en-US changelogs dir.
          # Using a directory + -A ensures this is a silent no-op when nothing
          # changed (e.g. the script exits early because no pending "next"
          # entry exists after a release).
          git add -A fastlane/metadata/android/en-US/changelogs/
          if git diff --cached --quiet; then
            echo "No staged changes after regen; nothing to commit."
            exit 0
          fi
          git commit -m "i18n: sync fastlane en-US next.txt from changelog.json"
          git push origin HEAD:${{ github.ref_name }}
