project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/strings.xml
    translation: /app/src/main/res/values-%android_code%/strings.xml
    language_mapping:
      pt-BR:
        android_code: "pt-rBR"
      zh-CN:
        android_code: "b+zh+Hans"
      zh-TW:
        android_code: "b+zh+Hant"

  - source: /fastlane/metadata/android/en-US/*.txt
    translation: /fastlane/metadata/android/%locale_with_underscore%/%original_file_name%

  - source: /fastlane/metadata/android/en-US/changelogs/*.txt
    translation: /fastlane/metadata/android/%locale_with_underscore%/changelogs/%original_file_name%
